[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-future-af-poc"
version = "0.1.0"
description = "Research PoC for future atrial-fibrillation risk from sinus-rhythm 12-lead ECGs"
requires-python = ">=3.10,<3.13"
dependencies = [
  "duckdb>=1.1",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "torch>=2.2",
  "wfdb>=4.1",
]

[project.optional-dependencies]
app = ["streamlit>=1.32"]
dev = ["jupyter>=1.0", "nbformat>=5.9", "pytest>=8.0", "ruff>=0.3"]

[project.scripts]
ecg-ai-build-cohort = "ecg_ai.cohort:main"
ecg-ai-train = "ecg_ai.train:main"
ecg-ai-batch-predict = "ecg_ai.batch_predict:main"
ecg-ai-evaluate = "ecg_ai.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
